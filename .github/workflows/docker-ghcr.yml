# Builds the customised image and publishes it to GitHub Container Registry
# using the built-in GITHUB_TOKEN. Kept separate from the upstream
# docker-build.yml / docker-image-branch.yml (which publish to Docker Hub and
# need DOCKERHUB_* secrets) so that merging upstream never conflicts here.
name: Publish image to GHCR

on:
  push:
    branches:
      - main
      - claude/new-api-waffo-pancake-custom-bvh3x8
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve image name and tags
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve image name and tags
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          # GHCR only accepts lowercase repository paths.
          IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          {
            echo "image=${IMAGE}"
            echo "short_sha=${SHORT_SHA}"
            echo "version=custom-${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:latest and ${IMAGE}:${SHORT_SHA}"

  build:
    name: Build and push (${{ matrix.arch }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The repository ships an empty VERSION file; the Dockerfile bakes its
      # contents into both the frontend bundle and common.Version, so the
      # running instance reports which commit it was built from.
      - name: Write VERSION
        run: echo "${{ needs.prepare.outputs.version }}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image }}:latest-${{ matrix.arch }}
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.short_sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # Attestation manifests would end up in the multi-arch index below
          # without adding anything here, since these images are not signed.
          provenance: false

  manifest:
    name: Create multi-arch manifests
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          for tag in latest "$SHORT_SHA"; do
            docker buildx imagetools create \
              -t "${IMAGE}:${tag}" \
              "${IMAGE}:${tag}-amd64" \
              "${IMAGE}:${tag}-arm64"
          done

      - name: Summary
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          {
            echo "### Image published"
            echo ''
            echo '```'
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${SHORT_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
